- name: Install Nginx and Certbot
  apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    install_recommends: no
    cache_valid_time: 3600

- name: Set Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: Reload Nginx

- name: Disable Nginx default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify:
    - Reload Nginx

- name: Override certbot service to authenticate via nginx
  template:
    src: certbot.service
    dest: /lib/systemd/system/certbot.service
  notify:
    # Make sure that systemd reloads any changes
    - Reload Nginx

- name: Copy Maintenance directory
  copy:
    src: maintenance/
    dest: /srv/maintenance
    owner: www-data
    group: www-data

- meta: flush_handlers

# Certbot's Nginx plugin solves the HTTP-01 challenge through Nginx itself, so
# Nginx must be installed and running before any certificate is requested.
- name: Enable and start Nginx
  systemd:
    name: nginx
    state: started
    enabled: yes

- name: Generate DH parameters
  shell:
    cmd: "openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048"
    creates: /etc/letsencrypt/ssl-dhparams.pem
  when: letsencrypt_email is defined

- name: Obtain the TLS certificates
  include_tasks: certificate.yml
  loop:
    - "{{ domain_name }}"
    - "{{ api_domain_name }}"
  loop_control:
    loop_var: certbot_domain
  when: letsencrypt_email is defined
