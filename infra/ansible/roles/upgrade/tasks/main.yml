- name: Upgrade packages
  apt:
    upgrade: dist
    update_cache: yes
    autoremove: yes
    autoclean: yes
  when: upgrade_packages == True

- name: Check if a reboot is needed
  stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot if needed
  reboot:
  when: reboot_required.stat.exists == True
